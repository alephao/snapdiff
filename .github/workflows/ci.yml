name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: make lint # gofmt check (excludes *_templ.go) + go vet
      - run: make test # go test ./...
      - run: make acceptance # go test -tags acceptance ./test/acceptance/...
